name: Validar APK Android
on:
  workflow_dispatch:
  push:
    branches: [codex/doce-atelie]
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras e compilar aplicativo e testes nativos
        run: |
          node --test android/tests/logic.test.cjs
          bash android/ci-gradle.sh assembleDebug assembleDebugAndroidTest lintDebug
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar e testar em um emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash android/ci-emulator.sh
      - name: Guardar diagnóstico e APK de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DoceAtelie-Android-Validacao
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/distribuicao/teste-emulador.png
            android/app/build/outputs/apk/debug/*.apk
            android-gradle.log
      - name: Disponibilizar APK para instalação
        uses: actions/upload-artifact@v4
        with:
          name: DoceAtelie-Android-APK
          path: android/distribuicao/DoceAtelie-Android-1.0.2.apk
