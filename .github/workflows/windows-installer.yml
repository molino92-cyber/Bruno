name: Gerar instalador Windows
on:
  workflow_dispatch:
  push:
    branches:
      - codex/doce-atelie
permissions:
  contents: read
concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    name: Validar servidor Android e iOS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Gerar imagem do servidor
        run: docker build -f deploy/Dockerfile -t doce-mobile:teste .
      - name: Iniciar servidor e validar acesso real
        env:
          DOCE_MOBILE_PASSWORD: senha-apenas-ci-2026
        run: |
          docker run -d --name doce-mobile -p 127.0.0.1:8080:8080 -e DOCE_MOBILE_PASSWORD -e DOCE_PUBLIC_URL=http://localhost:8080 doce-mobile:teste
          python packaging/smoke_mobile.py http://localhost:8080
      - name: Encerrar teste e mostrar diagnóstico
        if: always()
        run: |
          docker logs doce-mobile || true
          docker rm -f doce-mobile || true
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar Inno Setup." }
          }
      - name: Testar e gerar executável e instalador
        shell: pwsh
        run: |
          try {
            & ./packaging/build-windows.ps1 *>&1 | Tee-Object -FilePath build-windows.log
          } catch {
            $detail = if (Test-Path build-windows.log) { (Get-Content build-windows.log -Tail 55) -join "`n" } else { $_.ToString() }
            $encoded = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Detalhes da compilação::$encoded"
            throw
          }
      - name: Guardar log da compilação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DoceAtelie-Log-Compilacao
          path: build-windows.log
          if-no-files-found: ignore
      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: DoceAtelie-Instalador-Windows-x64
          path: dist/instalador/*.exe
          if-no-files-found: error
      - name: Disponibilizar versão portátil
        uses: actions/upload-artifact@v4
        with:
          name: DoceAtelie-Portatil-Windows-x64
          path: dist/DoceAtelie/
          if-no-files-found: error
      - name: Preparar versão Android e iOS para hospedagem
        run: python packaging/package-mobile.py
      - name: Disponibilizar versão Android e iOS
        uses: actions/upload-artifact@v4
        with:
          name: DoceAtelie-Android-iOS-PWA
          path: dist/DoceAtelie-Android-iOS-*.zip
          if-no-files-found: error
  publish:
    name: Publicar instalador com download direto
    needs: [build, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DoceAtelie-Instalador-Windows-x64
          path: instalador
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const files = fs.readdirSync('instalador').filter(f => /^DoceAtelie-Instalador-\d+\.\d+\.\d+-Windows-x64\.exe$/.test(f));
            if (files.length !== 1) throw new Error('Esperado exatamente um instalador Windows.');
            const filename = files[0];
            const version = filename.match(/Instalador-(\d+\.\d+\.\d+)-/)[1];
            const tag = 'windows-v' + version;
            const data = fs.readFileSync('instalador/' + filename);
            const sha = crypto.createHash('sha256').update(data).digest('hex');
            const body = `Nome e logo da confeitaria editáveis em Configurações, no cabeçalho e nos próximos orçamentos. Logo proporcional e dados preservados ao atualizar.\n\nBaixe o arquivo .exe abaixo e instale sobre a versão existente. Não precisa baixar ZIP nem ter conta GitHub.\n\nSHA-256: \`${sha}\``;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
              // Uma versão já publicada é imutável. Para novo código, aumente a versão.
              if (release.assets.some(a => a.name === filename)) {
                core.info('Instalador desta versão já publicado.');
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({...context.repo, tag_name:tag, target_commitish:context.sha, name:'Windows ' + version + ' · Identidade da confeitaria', body, draft:false, prerelease:false})).data;
            }
            await github.rest.repos.uploadReleaseAsset({...context.repo, release_id:release.id, name:filename, data, headers:{'content-type':'application/octet-stream','content-length':data.length}});
